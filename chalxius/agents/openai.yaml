interface:
  display_name: "Chalxius"
  short_description: "Goal-driven research integrity and an active Main frontier"
  default_prompt: "Use $chalxius in automatic mode for source-bound Research. Main first uses typed exact Research/Fact navigation, follows exact task bindings and deep Campaign/COW successor lineage, and refreshes an advisory checkpoint only after semantic judgment; stable product roots, in-flight supervision, productive routes, and clean review evidence remain distinct. Active-goal workflow is primary, while goal-unmapped Campaign attention stays bounded and secondary. Then Main explicitly chooses bounded nonduplicative work. An exact existing Research id literally named in selected Research prose is directly frozen as predecessor context; this never substitutes for Main's relevance judgment. Bind new Research atomically with memory-add --campaign when a durable objective is useful; Campaign is context, not a scheduler, and routine status uses one compact current view rather than replaying history. Use genuine independent slots for mathematical production and review; delegate ordinary engineering only for positive coordination-adjusted critical-path value. Select second-subround review only from the static reproduced-failure registry, keep default Blackboard access root-only and read-only unless exact broader capability is needed, and do not start new V5 Pulse planning. For paper-led work preserve the exact Paper target closure, philosophical atomicity, and plain-language clarity; keep Attack and CHX reports separate, and admit Facts only through a fresh verifier and Fact Gateway."
policy:
  allow_implicit_invocation: true
